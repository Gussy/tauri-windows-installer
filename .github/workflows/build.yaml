name: Build Tauri App Installer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Install locked frontend dependencies
        working-directory: demo-app
        run: pnpm install --frozen-lockfile
      - name: Build installer first, then embed it in bundler
        shell: pwsh
        run: |
          cargo build --locked --release -p twi_installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $env:TWI_SETUP_EXE = (Resolve-Path target\release\setup.exe).Path
          cargo build --locked --release -p twi_bundler
          if ($LASTEXITCODE -ne 0) { throw 'Bundler build failed' }
      - name: Build demo app
        working-directory: demo-app
        run: pnpm tauri build -- --locked
      - name: Package demo installer
        run: .\target\release\bundler.exe --tauri-conf .\demo-app\src-tauri\tauri.conf.json --app .\target\release\demo-app.exe --title 'Demo App'
      - uses: actions/upload-artifact@v4
        with:
          name: demo-windows-installer
          path: |
            demo-app-setup.exe
            target/release/bundler.exe
            target/release/setup.exe
          if-no-files-found: error
