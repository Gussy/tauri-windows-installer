name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REQUESTED_TAG:-${GITHUB_REF#refs/tags/}}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid version tag' >&2; exit 1; }
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  validate:
    needs: resolve-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Match package version to tag
        env:
          TAG_VERSION: ${{ needs.resolve-ref.outputs.version }}
        run: |
          CARGO_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "twi_bundler"))')
          test "$CARGO_VERSION" = "$TAG_VERSION"
  ci:
    needs: [resolve-ref, validate]
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.resolve-ref.outputs.sha }}
  release:
    needs: [resolve-ref, ci]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Build installer
        run: cargo build --locked --release -p twi_installer
      - name: Sign installer stub when configured
        if: vars.TWI_RELEASE_SIGN_PROGRAM != ''
        shell: pwsh
        env:
          TWI_RELEASE_SIGN_PROGRAM: ${{ vars.TWI_RELEASE_SIGN_PROGRAM }}
          TWI_RELEASE_SIGN_ARGS: ${{ secrets.TWI_RELEASE_SIGN_ARGS }}
        run: ./tests/sign-release.ps1 -Files target\release\setup.exe
      - name: Build bundler from exact stub
        shell: pwsh
        run: |
          $env:TWI_SETUP_EXE = (Resolve-Path target\release\setup.exe).Path
          cargo build --locked --release -p twi_bundler
          if ($LASTEXITCODE -ne 0) { throw 'Bundler build failed' }
      - name: Sign bundler when configured
        if: vars.TWI_RELEASE_SIGN_PROGRAM != ''
        shell: pwsh
        env:
          TWI_RELEASE_SIGN_PROGRAM: ${{ vars.TWI_RELEASE_SIGN_PROGRAM }}
          TWI_RELEASE_SIGN_ARGS: ${{ secrets.TWI_RELEASE_SIGN_ARGS }}
        run: ./tests/sign-release.ps1 -Files target\release\bundler.exe
      - name: Verify artifact version, ABI, hash, manifest, runtime, and signature policy
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.resolve-ref.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
          REQUIRE_SIGNATURE: ${{ vars.TWI_REQUIRE_RELEASE_SIGNATURE }}
        run: ./tests/verify-release.ps1 -ExpectedVersion $env:EXPECTED_VERSION -Commit $env:RELEASE_COMMIT -RequireSignature:($env:REQUIRE_SIGNATURE -eq 'true')
      - name: Release notes for requested commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-ref.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          PREV_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$RELEASE_COMMIT^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%h)' "$PREV_TAG..$RELEASE_COMMIT" > release-notes.txt
          else
            git log --pretty=format:'- %s (%h)' "$RELEASE_COMMIT" > release-notes.txt
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-ref.outputs.tag }}
          name: ${{ needs.resolve-ref.outputs.tag }}
          body_path: release-notes.txt
          files: |
            target/release/setup.exe
            target/release/setup.exe.sha256
            target/release/bundler.exe
            target/release/bundler.exe.sha256
            target/release/provenance.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(needs.resolve-ref.outputs.tag, '-') }}
