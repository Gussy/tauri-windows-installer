name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Rust and shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev shellcheck
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.93.1-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p twi_core --features bundler -p twi_bundler --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Test optimized GLib advisory backport
        run: cargo test --locked --release -p twi-glib-backport-test
      - name: Shell syntax and regression tests
        run: |
          bash -n tests/*.sh tests/helpers/*.sh
          shellcheck -e SC1090,SC1091 tests/*.sh tests/helpers/*.sh
          bash tests/harness-regression.sh
  windows:
    name: Windows runtime and durability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.93.1-${{ hashFiles('Cargo.lock') }}
      - name: Build runtime and fixture before bundler
        shell: pwsh
        run: |
          cargo build --locked --release -p twi_uninstaller --example twi-test-app
          if ($LASTEXITCODE -ne 0) { throw 'Runtime / fixture build failed' }
          cargo build --locked --release -p twi_installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $env:TWI_SETUP_EXE = (Resolve-Path target\release\setup.exe).Path
          cargo build --locked --release -p twi_bundler
          if ($LASTEXITCODE -ne 0) { throw 'Bundler build failed' }
      - name: Compile and test all shipping Windows crates
        shell: pwsh
        run: |
          $env:TWI_SETUP_EXE = (Resolve-Path target\release\setup.exe).Path
          cargo test --locked -p twi_core --features bundler -p twi_bundler -p twi_installer -p twi_uninstaller
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          cargo clippy --locked -p twi_core --features bundler -p twi_bundler -p twi_installer -p twi_uninstaller --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Windows Clippy failed' }
      - name: Validate packaged installer on native Windows
        shell: pwsh
        run: |
          ./tests/pe-resources-regression.ps1
          ./tests/cleanup-worker-regression.ps1
          powershell.exe -NoProfile -NonInteractive -File ./tests/cleanup-worker-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell cleanup guards failed' }
          ./tests/windows-e2e.ps1
      - name: Check release artifact provenance
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq twi_bundler).version
          ./tests/verify-release.ps1 -ExpectedVersion $version -Commit '${{ inputs.ref || github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-durability-results
          path: target/e2e-results
          if-no-files-found: warn
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Install pinned advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Deny vulnerabilities and unsoundness
        run: python3 tests/audit-dependencies.py
