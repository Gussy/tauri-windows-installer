[workspace]
resolver = "2"
members = [
    "demo-app/src-tauri",
    "core",
    "bundler",
    "installer",
    "uninstaller",
]
package.version = "0.2.0"
package.edition = "2021"
package.authors = ["@Gussy"]
package.license = "MIT"
package.repository = "https://github.com/Gussy/tauri-windows-installer"
package.homepage = "https://github.com/Gussy/tauri-windows-installer"
package.description = "Pure-Rust, zero-click Windows installer for Tauri apps"
package.keywords = ["tauri", "installer", "windows", "bundler"]
package.categories = ["development-tools"]

# "demo-app/src-tauri" has its own Tauri build requirements,
# "installer" and "uninstaller" are Windows-only,
# so they are not built by default
default-members = ["core", "bundler"]

[workspace.dependencies]
# Local dependencies
twi_core = { path = "core" }
twi_installer = { path = "installer" }
twi_uninstaller = { path = "uninstaller" }

# External dependencies
tauri = { version = "2" }
libsui = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
bytesize = "2.3.1"
anyhow = "1.0.103"
winreg = "0.52.0"
tar = "0.4.45"
zstd = "0.13"
ruzstd = "0.7"
editpe = "0.1.0"
serde_json = "1.0.149"
sysinfo = "0.38.4"
sha2 = "0.10.9"
semver = "1.0.27"
tempfile = "3.27.0"

[patch.crates-io]
libsui = { path = "vendor/libsui" }
glib = { path = "vendor/glib" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
