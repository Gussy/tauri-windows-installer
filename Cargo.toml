[workspace]
resolver = "2"
members = [
    "demo-app/src-tauri",
    "bundler-lib",
    "bundler",
    "installer",
    "uninstall",
]
package.version = "0.1.0"
package.edition = "2021"
package.authors = ["@Gussy"]
package.license = "MIT"

# "demo-app/src-tauri" has its own Tauri build requirements,
# "installer" and "uninstall" are Windows-only,
# so they are not built by default
default-members = ["bundler-lib", "bundler"]

[workspace.dependencies]
# Local dependencies
twi_bundler_lib = { path = "bundler-lib" }
twi_installer = { path = "installer" }
twi_uninstall = { path = "uninstall" }

# External dependencies
tauri = { version = "2" }
bytesize = "2.3.1"
anyhow = "1.0.102"
winreg = "0.52.0"
remove_dir_all_ext = "0.8.4"
