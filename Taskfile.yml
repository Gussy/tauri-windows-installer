version: "3"

tasks:
  check:
    desc: Check default crates compile (bundler-lib + bundler)
    cmds:
      - cargo check

  check-all:
    desc: Check all workspace crates compile
    cmds:
      - cargo check --workspace

  test:
    desc: Run tests for default crates
    cmds:
      - cargo test

  test-all:
    desc: Run tests for all workspace crates
    cmds:
      - cargo test --workspace

  build:
    desc: Build default crates (bundler-lib + bundler)
    cmds:
      - cargo build

  build-installer:
    desc: Build the Windows installer (setup.exe) — Windows only
    cmds:
      - cargo build --package twi_installer

  build-bundler:
    desc: Build the bundler (requires setup.exe to exist)
    cmds:
      - cargo build --package twi_bundler

  clippy:
    desc: Run clippy on the workspace
    cmds:
      - cargo clippy --workspace

  fmt:
    desc: Format all code
    cmds:
      - cargo fmt --all

  fmt-check:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  vm:deps:
    desc: Install macOS dependencies for VM testing
    cmds:
      - brew bundle

  vm:build-image:
    desc: Build Windows 11 ARM golden image with Packer
    cmds:
      - cd packer && packer init . && packer build -force -var "iso_path={{.ISO_PATH}}" -var "virtio_iso_path={{.VIRTIO_ISO_PATH}}" .

  vm:snapshot:
    desc: Create clean baseline snapshot
    cmds:
      - ./tests/helpers/vm.sh snapshot-create

  vm:start:
    desc: Start the test VM
    cmds:
      - utmctl start {{.VM_NAME | default "windows-11-test"}}

  vm:stop:
    desc: Stop the test VM
    cmds:
      - utmctl stop {{.VM_NAME | default "windows-11-test"}}

  test:e2e:
    desc: Run all end-to-end VM tests
    env:
      SETUP_EXE: '{{.SETUP_EXE | default "demo-app-setup.exe"}}'
    cmds:
      - ./tests/run.sh

  test:e2e:single:
    desc: Run a single VM test (task test:e2e:single -- test-fresh-install)
    env:
      SETUP_EXE: '{{.SETUP_EXE | default "demo-app-setup.exe"}}'
    cmds:
      - ./tests/run.sh {{.CLI_ARGS}}
