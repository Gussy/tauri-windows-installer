[package]
name = "twi_bundler"
version.workspace = true
edition.workspace = true
authors.workspace = true
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "setup.exe"]

[[bin]]
name = "bundler"
path = "src/main.rs"

[dependencies]
twi_bundler_lib.workspace = true
bytesize.workspace = true
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
editpe = "0.1.0"
