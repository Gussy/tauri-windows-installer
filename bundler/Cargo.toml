[package]
name = "twi_bundler"
version.workspace = true
edition.workspace = true
authors.workspace = true
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "setup.exe"]

[[bin]]
name = "bundler"
path = "src/main.rs"

[dependencies]
twi_bundler_lib.workspace = true
tauri.workspace = true
libsui.workspace = true
serde.workspace = true
bytesize.workspace = true
tar.workspace = true
editpe.workspace = true
indexmap = "2.1"
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["blocking"] }
dirs-next = "2.0.0"
shell-words = "1.1.0"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"
